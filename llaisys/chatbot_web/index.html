<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLaiSys Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 { font-size: 18px; color: #e94560; }
        .header .status { font-size: 12px; color: #4ecca3; }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }
        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .message.user .avatar { background: #e94560; }
        .message.assistant .avatar { background: #4ecca3; }
        .message .content {
            background: #0f3460;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user .content { background: #e94560; }
        .input-area {
            background: #16213e;
            padding: 16px 24px;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 12px;
        }
        .input-area textarea {
            flex: 1;
            background: #0f3460;
            border: 1px solid #1a1a4e;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 120px;
        }
        .input-area textarea:focus { border-color: #e94560; }
        .input-area button {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .input-area button:hover { background: #d63851; }
        .input-area button:disabled { background: #555; cursor: not-allowed; }
        .settings {
            display: flex;
            gap: 16px;
            padding: 8px 24px;
            background: #16213e;
            font-size: 12px;
            align-items: center;
        }
        .settings label { color: #888; }
        .settings input[type="range"] { width: 80px; }
        .settings span { color: #4ecca3; min-width: 30px; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #4ecca3;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>LLaiSys Chat</h1>
        <span class="status" id="status">Connecting...</span>
    </div>
    <div class="settings">
        <label>Temperature:</label>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.8">
        <span id="temp-val">0.8</span>
        <label>Top-P:</label>
        <input type="range" id="top_p" min="0" max="1" step="0.05" value="1.0">
        <span id="topp-val">1.0</span>
        <label>Top-K:</label>
        <input type="range" id="top_k" min="0" max="100" step="1" value="0">
        <span id="topk-val">0</span>
        <label>Max Tokens:</label>
        <input type="range" id="max_tokens" min="16" max="1024" step="16" value="256">
        <span id="maxt-val">256</span>
    </div>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const status = document.getElementById('status');

        // Settings
        const tempSlider = document.getElementById('temperature');
        const toppSlider = document.getElementById('top_p');
        const topkSlider = document.getElementById('top_k');
        const maxtSlider = document.getElementById('max_tokens');

        tempSlider.oninput = () => document.getElementById('temp-val').textContent = tempSlider.value;
        toppSlider.oninput = () => document.getElementById('topp-val').textContent = toppSlider.value;
        topkSlider.oninput = () => document.getElementById('topk-val').textContent = topkSlider.value;
        maxtSlider.oninput = () => document.getElementById('maxt-val').textContent = maxtSlider.value;

        let messages = [];

        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                const data = await res.json();
                status.textContent = data.model_loaded ? 'Ready' : 'Loading...';
                status.style.color = data.model_loaded ? '#4ecca3' : '#e94560';
            } catch {
                status.textContent = 'Disconnected';
                status.style.color = '#e94560';
            }
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? 'U' : 'A'}</div>
                <div class="content">${escapeHtml(content)}</div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const content = input.value.trim();
            if (!content) return;

            input.value = '';
            sendBtn.disabled = true;
            input.disabled = true;

            // Add user message
            messages.push({ role: 'user', content });
            addMessage('user', content);

            // Add assistant placeholder
            const assistantDiv = addMessage('assistant', '');
            const contentDiv = assistantDiv.querySelector('.content');
            contentDiv.innerHTML = '<span class="spinner"></span>';

            try {
                const res = await fetch(`${API_BASE}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llaisys-qwen2',
                        messages,
                        max_tokens: parseInt(maxtSlider.value),
                        temperature: parseFloat(tempSlider.value),
                        top_p: parseFloat(toppSlider.value),
                        top_k: parseInt(topkSlider.value),
                        stream: true,
                    }),
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(data);
                            const delta = parsed.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullContent += delta;
                                contentDiv.textContent = fullContent;
                                chat.scrollTop = chat.scrollHeight;
                            }
                        } catch {}
                    }
                }

                messages.push({ role: 'assistant', content: fullContent });
            } catch (err) {
                contentDiv.textContent = `Error: ${err.message}`;
            }

            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        checkHealth();
        setInterval(checkHealth, 5000);
    </script>
</body>
</html>
